<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ----- Professional elegant login UI ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #dce4ee 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }

  .login-shell {
    width: 100%;
    max-width: 440px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .login-card {
    background: #ffffff;
    border-radius: 32px;
    padding: 48px 40px 40px;
    box-shadow: 
      0 24px 60px rgba(0, 20, 40, 0.10),
      0 8px 24px rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(230, 236, 243, 0.6);
    transition: box-shadow 0.3s ease, transform 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #2b4f9e, #5b7fd4, #7b9fe0);
  }

  .login-card:hover {
    box-shadow: 
      0 32px 72px rgba(0, 20, 40, 0.14),
      0 8px 28px rgba(0, 0, 0, 0.06);
    transform: translateY(-2px);
  }

  .login-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .login-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 68px;
    height: 68px;
    background: linear-gradient(145deg, #2b4f9e, #4a7ad4);
    border-radius: 20px;
    font-size: 28px;
    font-weight: 700;
    color: white;
    box-shadow: 0 8px 28px rgba(43, 79, 158, 0.30);
    margin-bottom: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    letter-spacing: -0.5px;
  }

  .login-mark:hover {
    transform: scale(1.05) rotate(-2deg);
    box-shadow: 0 12px 36px rgba(43, 79, 158, 0.35);
  }

  .login-title {
    font-size: 26px;
    font-weight: 700;
    color: #142435;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .login-sub {
    font-size: 15px;
    color: #6f7d92;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #3d5775;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .field input {
    width: 100%;
    padding: 14px 18px;
    background: #f8faff;
    border: 2px solid #e2e8f2;
    border-radius: 14px;
    font-size: 15px;
    color: #142435;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    outline: none;
  }

  .field input::placeholder {
    color: #a8b8d0;
    font-weight: 400;
  }

  .field input:focus {
    border-color: #2b4f9e;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(43, 79, 158, 0.08);
  }

  .field input.error {
    border-color: #e74c3c;
    background: #fef6f8;
    box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.06);
  }

  .btn-primary {
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(145deg, #1f3f7a, #2b4f9e);
    border: none;
    border-radius: 60px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(43, 79, 158, 0.20);
    letter-spacing: 0.3px;
    margin-top: 4px;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn-primary:hover::after {
    opacity: 1;
  }

  .btn-primary:hover {
    background: linear-gradient(145deg, #244b8f, #3460b0);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(43, 79, 158, 0.30);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 4px 16px rgba(43, 79, 158, 0.15);
  }

  .error-text {
    margin-top: 16px;
    padding: 12px 18px;
    background: #fef6f8;
    border: 1.5px solid #f5d0d8;
    border-radius: 14px;
    color: #c0392b;
    font-size: 14px;
    font-weight: 500;
    animation: shake 0.35s ease;
  }

  .hidden {
    display: none;
  }

  .footnote {
    margin-top: 28px;
    text-align: center;
    font-size: 13px;
    color: #8d9bb0;
    line-height: 1.6;
    border-top: 1px solid #eef3f8;
    padding-top: 22px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card {
      padding: 32px 24px 28px;
      border-radius: 24px;
    }
    .login-title {
      font-size: 21px;
    }
    .login-mark {
      width: 58px;
      height: 58px;
      font-size: 22px;
    }
    .field input {
      padding: 12px 16px;
      font-size: 14px;
    }
    .btn-primary {
      padding: 14px 20px;
      font-size: 15px;
    }
  }

  /* Dark mode support */
  @media (prefers-color-scheme: dark) {
    body {
      background: linear-gradient(135deg, #1a2332, #0f1728);
    }
    .login-card {
      background: #1e2a3a;
      border-color: #2a3648;
    }
    .login-card::before {
      background: linear-gradient(90deg, #4a7ad4, #7b9fe0, #9bb8e8);
    }
    .login-title {
      color: #e8edf5;
    }
    .login-sub {
      color: #8d9bb0;
    }
    .field label {
      color: #b0c0d8;
    }
    .field input {
      background: #14202e;
      border-color: #2a3648;
      color: #e8edf5;
    }
    .field input::placeholder {
      color: #5a6d87;
    }
    .field input:focus {
      background: #1a2638;
      border-color: #4a7ad4;
      box-shadow: 0 0 0 4px rgba(74, 122, 212, 0.10);
    }
    .footnote {
      border-top-color: #2a3648;
      color: #6a7d92;
    }
    .error-text {
      background: #2a1a22;
      border-color: #5a3a46;
      color: #e8a0b0;
    }
  }
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-header">
      <div class="login-mark">CF</div>
      <div class="login-title">Cockpit Wagering Terminal</div>
      <div class="login-sub">Sign in with your teller or admin account</div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" autofocus placeholder="Enter your username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">
      </div>
      <button type="submit" id="login-submit" class="btn btn-primary">Sign in</button>
      <div id="login-error" class="error-text hidden"></div>
    </form>

    <div class="footnote">Access is role-based — you'll be routed to the correct dashboard automatically.</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
